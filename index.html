<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Video Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <!-- Replace src with your uploaded video path (e.g., assets/your-video.mp4) -->
    <video id="heroVideo" class="hero-video" src="assets/video.mp4" playsinline preload="metadata" poster="" crossorigin="anonymous"></video>

    <div class="overlay">
      <h1 class="title">Experience the Moment</h1>
      <p class="subtitle">Smooth animations · Interactive controls · Modern design</p>

      <div class="controls">
        <button id="playBtn" class="btn primary">Play</button>
        <button id="muteBtn" class="btn">Mute</button>
        <div id="progress" class="progress" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <button id="likeBtn" class="btn like" aria-pressed="false">❤</button>
        <button id="fsBtn" class="btn">⤢</button>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
